name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a PR cancels its older run; runs on main always finish
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest

    # Pages are prerendered from the database at build time, and integration tests need it too
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: audiophile_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/audiophile_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # postinstall runs prisma generate
      - run: npm ci
      - run: npm run lint
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm test
      - run: npm run build
      # Runs after build because next-env.d.ts (gitignored) is generated by the build and
      # declares image imports. Build already type-checks too; this keeps the step explicit.
      - run: npm run typecheck
